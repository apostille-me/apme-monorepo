[package]
org = "apostille-me"
name = "apme-monorepo"
version = "0.1.0"
description = "High-context development monorepo for Apostille Me"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/apostille-me/apme-monorepo"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log"]

[scripts]
test = "bash scripts/test.sh"
